version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DB_HOST=db
      - DB_NAME=odoo_fastapi
      - DB_USER=odoo
      - DB_PASSWORD=odoo
      - MODULES_PATH=modules
      - PYTHONUNBUFFERED=1
      - WORKERS=4
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=odoo_fastapi
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
